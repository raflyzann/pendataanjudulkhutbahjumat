<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendataan Judul Khutbah Jumat — Wahdah Islamiyah Makassar</title>

<!-- Bootstrap 5 CDN -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
/* =====================================================================
   BLOK CSS — TEMA ISLAMI (HIJAU, PUTIH, AKSEN EMAS)
   ===================================================================== */
:root{
  --wi-green-dark:#0b3d2e;
  --wi-green:#0f5132;
  --wi-green-light:#1a7a4c;
  --wi-gold:#c9a227;
  --wi-gold-light:#e6c65c;
  --wi-cream:#fbf9f3;
  --wi-gray:#6c757d;
  --radius:14px;
}

*{ box-sizing:border-box; }

body{
  background:linear-gradient(180deg, var(--wi-cream) 0%, #f3f0e6 100%);
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color:#222;
  min-height:100vh;
  padding-bottom:40px;
}

/* ---------- Header ---------- */
.app-header{
  background:linear-gradient(135deg, var(--wi-green-dark), var(--wi-green) 60%, var(--wi-green-light));
  color:#fff;
  padding:28px 20px 60px;
  position:relative;
  overflow:hidden;
  border-bottom:4px solid var(--wi-gold);
}
.app-header::before{
  content:"";
  position:absolute;
  top:-40px; right:-40px;
  width:180px; height:180px;
  border-radius:50%;
  background:rgba(201,162,39,0.15);
}
.app-header::after{
  content:"";
  position:absolute;
  bottom:-60px; left:-30px;
  width:150px; height:150px;
  border-radius:50%;
  background:rgba(255,255,255,0.06);
}
.app-header h1{
  font-weight:700;
  font-size:1.55rem;
  margin-bottom:4px;
  position:relative;
  z-index:2;
}
.app-header p{
  margin:0;
  opacity:0.9;
  font-size:0.92rem;
  position:relative;
  z-index:2;
}
.app-header .icon-badge{
  width:58px;height:58px;
  background:rgba(255,255,255,0.92);
  border:2px solid var(--wi-gold-light);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  padding:5px;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.app-header .icon-badge img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ---------- Main container overlapping header ---------- */
.main-wrapper{
  max-width:820px;
  margin:-38px auto 0;
  padding:0 16px;
  position:relative;
  z-index:5;
}

.card-shell{
  background:#fff;
  border-radius:var(--radius);
  box-shadow:0 10px 30px rgba(15,81,50,0.12);
  border:1px solid rgba(201,162,39,0.15);
  overflow:hidden;
}

/* ---------- Tab Navigator ---------- */
.tab-nav{
  display:flex;
  background:var(--wi-cream);
  border-bottom:1px solid rgba(15,81,50,0.1);
}
.tab-nav button{
  flex:1;
  border:none;
  background:transparent;
  padding:14px 10px;
  font-weight:600;
  font-size:0.88rem;
  color:var(--wi-gray);
  cursor:pointer;
  transition:all .25s ease;
  border-bottom:3px solid transparent;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.tab-nav button.active{
  color:var(--wi-green);
  border-bottom-color:var(--wi-gold);
  background:#fff;
}
.tab-nav button:hover:not(.active){
  color:var(--wi-green-light);
  background:rgba(15,81,50,0.04);
}

.tab-content{ padding:22px; }
.tab-pane{ display:none; animation:fadeIn .35s ease; }
.tab-pane.active{ display:block; }

@keyframes fadeIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}

/* ---------- Form ---------- */
.form-label{
  font-weight:600;
  color:var(--wi-green-dark);
  font-size:0.86rem;
  margin-bottom:5px;
}
.form-label .required-star{ color:#c0392b; }
.form-select, .form-control{
  border-radius:10px;
  border:1.5px solid #e1ded0;
  padding:10px 12px;
  font-size:0.92rem;
  transition:border-color .2s, box-shadow .2s;
}
.form-select:focus, .form-control:focus{
  border-color:var(--wi-green-light);
  box-shadow:0 0 0 3px rgba(15,81,50,0.12);
}
.form-text-hint{
  font-size:0.78rem;
  color:var(--wi-gray);
  margin-top:3px;
}
.tanggal-preview{
  font-size:0.82rem;
  color:var(--wi-green);
  font-weight:600;
  margin-top:4px;
  min-height:1.1em;
}

.btn-wi-primary{
  background:linear-gradient(135deg, var(--wi-green), var(--wi-green-light));
  border:none;
  color:#fff;
  font-weight:600;
  padding:11px 20px;
  border-radius:10px;
  width:100%;
  transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  box-shadow:0 4px 14px rgba(15,81,50,0.25);
}
.btn-wi-primary:hover:not(:disabled){
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(15,81,50,0.32);
  color:#fff;
}
.btn-wi-primary:disabled{ opacity:0.7; cursor:not-allowed; }

/* ---------- Search Tab ---------- */
.search-wrapper{ position:relative; margin-bottom:14px; }
.search-wrapper i{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  color:var(--wi-gray);
}
#searchInput{ padding-left:38px; }

.counter-badge{
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(15,81,50,0.08);
  color:var(--wi-green-dark);
  border:1px solid rgba(15,81,50,0.15);
  border-radius:20px;
  padding:5px 14px;
  font-size:0.83rem;
  font-weight:600;
  margin-bottom:14px;
}

.table-responsive-wi{
  overflow-x:auto;
  border-radius:10px;
  border:1px solid #eee6d0;
}
table.wi-table{
  width:100%;
  border-collapse:collapse;
  font-size:0.85rem;
  min-width:680px;
}
table.wi-table thead th{
  background:var(--wi-green-dark);
  color:#fff;
  padding:10px 12px;
  text-align:left;
  white-space:nowrap;
  font-weight:600;
  position:sticky; top:0;
}
table.wi-table tbody td{
  padding:10px 12px;
  border-bottom:1px solid #f0ede0;
  vertical-align:top;
}
table.wi-table tbody tr:hover{ background:rgba(201,162,39,0.06); }
table.wi-table tbody tr:nth-child(even){ background:rgba(15,81,50,0.02); }

.judul-cell{ max-width:220px; }
.badge-masjid{
  background:rgba(15,81,50,0.09);
  color:var(--wi-green-dark);
  border-radius:6px;
  padding:3px 8px;
  font-size:0.76rem;
  font-weight:600;
  white-space:nowrap;
}
.btn-copy-row{
  border:1px solid var(--wi-gold);
  background:#fff;
  color:var(--wi-gold);
  border-radius:8px;
  padding:4px 9px;
  font-size:0.78rem;
  transition:all .15s;
}
.btn-copy-row:hover{ background:var(--wi-gold); color:#fff; }
.btn-copy-row.copied{ background:var(--wi-green); border-color:var(--wi-green); color:#fff; }

/* ---------- Pagination ---------- */
.pagination-wi{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  margin-top:16px;
}
.pagination-wi button{
  border:1.5px solid #e1ded0;
  background:#fff;
  color:var(--wi-green-dark);
  border-radius:8px;
  padding:6px 12px;
  font-size:0.85rem;
  font-weight:600;
  cursor:pointer;
  min-width:38px;
  transition:all .15s ease;
}
.pagination-wi button:hover:not(:disabled):not(.active){
  background:rgba(15,81,50,0.08);
  border-color:var(--wi-green-light);
}
.pagination-wi button.active{
  background:linear-gradient(135deg, var(--wi-green), var(--wi-green-light));
  border-color:var(--wi-green);
  color:#fff;
  cursor:default;
}
.pagination-wi button:disabled{
  opacity:0.4;
  cursor:not-allowed;
}
.pagination-wi .page-ellipsis{
  color:var(--wi-gray);
  padding:0 4px;
  font-size:0.85rem;
  user-select:none;
}

/* ---------- Skeleton Loader ---------- */
.skeleton-line{
  height:14px;
  border-radius:6px;
  background:linear-gradient(90deg, #ece7d6 25%, #f6f3e8 37%, #ece7d6 63%);
  background-size:400% 100%;
  animation:skeleton-shimmer 1.4s ease infinite;
  margin-bottom:8px;
}
@keyframes skeleton-shimmer{
  0%{ background-position:100% 50%; }
  100%{ background-position:0 50%; }
}
.skeleton-row td{ padding:10px 12px; }

.spinner-wi{
  width:1rem;height:1rem;
  border:2px solid rgba(255,255,255,0.5);
  border-top-color:#fff;
  border-radius:50%;
  display:inline-block;
  animation:spin .7s linear infinite;
  margin-right:6px;
  vertical-align:middle;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- Toast / Alert ---------- */
.wi-toast-container{
  position:fixed; top:16px; right:16px; z-index:2000;
  display:flex; flex-direction:column; gap:10px;
  max-width:90vw;
}
.wi-toast{
  min-width:260px; max-width:340px;
  background:#fff;
  border-left:5px solid var(--wi-green);
  border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,0.15);
  padding:12px 14px;
  display:flex; gap:10px; align-items:flex-start;
  animation:slideIn .3s ease;
}
.wi-toast.error{ border-left-color:#c0392b; }
.wi-toast i{ font-size:1.2rem; margin-top:2px; }
.wi-toast.success i{ color:var(--wi-green); }
.wi-toast.error i{ color:#c0392b; }
.wi-toast .toast-text{ font-size:0.85rem; flex:1; }
.wi-toast .toast-close{
  background:none; border:none; color:var(--wi-gray); font-size:0.95rem; cursor:pointer;
}
@keyframes slideIn{
  from{ opacity:0; transform:translateX(30px); }
  to{ opacity:1; transform:translateX(0); }
}
@keyframes fadeOutToast{
  to{ opacity:0; transform:translateX(20px); }
}

/* ---------- Footer ---------- */
.app-footer{
  text-align:center;
  margin-top:22px;
  color:var(--wi-gray);
  font-size:0.8rem;
  padding:0 16px;
}
.app-footer strong{ color:var(--wi-green-dark); }

.empty-state{
  text-align:center;
  padding:36px 16px;
  color:var(--wi-gray);
}
.empty-state i{ font-size:2.4rem; color:var(--wi-gold); margin-bottom:10px; display:block; }

@media (max-width: 480px){
  .app-header h1{ font-size:1.25rem; }
  .tab-nav button{ font-size:0.78rem; padding:12px 6px; }
}

/* ---------- Autocomplete kustom (pengganti Choices.js) ----------
   Hanya SATU kolom yang tampil: kolom itu langsung berfungsi sebagai
   kotak pencarian (ketik untuk mencari), tanpa kotak "tertutup" terpisah. */
.autocomplete-wrapper{ position:relative; }
.autocomplete-wrapper .form-control[disabled]{
  background:#f5f3ea;
  opacity:0.8;
  cursor:not-allowed;
}
.autocomplete-list{
  list-style:none;
  margin:6px 0 0;
  padding:4px 0;
  position:absolute;
  top:100%;
  left:0;
  right:0;
  background:#fff;
  border:1.5px solid var(--wi-green-light);
  border-radius:10px;
  box-shadow:0 8px 20px rgba(15,81,50,0.18);
  max-height:220px;
  overflow-y:auto;
  z-index:50;
  display:none;
}
.autocomplete-list.show{ display:block; }
.autocomplete-list li{
  padding:9px 14px;
  font-size:0.92rem;
  cursor:pointer;
  color:#222;
}
.autocomplete-list li.active,
.autocomplete-list li:hover{
  background:rgba(15,81,50,0.09);
  color:var(--wi-green-dark);
}
.autocomplete-list li.no-match{
  color:var(--wi-gray);
  cursor:default;
  font-size:0.85rem;
}
.autocomplete-list li.no-match:hover{ background:transparent; color:var(--wi-gray); }
</style>
</head>

<script>

// ------------------- KONFIGURASI -------------------
// GANTI baris di bawah ini dengan URL Web App Google Apps Script kamu
// (hasil Deploy > Manage deployments di editor Apps Script), contoh:
// "https://script.google.com/macros/s/AKfycb...........xyz/exec"
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbycUzQEcMNIp2vmEqFXsRogbuDUnLVan1Te5vtVSJ6Gws_UyZjFXdz-UWffQaQZYIXD/exec";

// ------------------- STATE APLIKASI -------------------
let khutbahDataFull = [];   // Seluruh data histori dari backend

let khatibAutocomplete = null;   // instance autocomplete untuk Khatib/Naib

function showToast(message, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'wi-toast ' + type;

  const icon = type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill';

  toast.innerHTML = `
    <i class="bi ${icon}"></i>
    <div class="toast-text">${message}</div>
    <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
  `;

  container.appendChild(toast);

  setTimeout(() => {
    toast.style.animation = 'fadeOutToast .3s ease forwards';
    setTimeout(() => toast.remove(), 300);
  }, 4200);
}

// =====================================================================
// FUNGSI: Format tanggal ke Bahasa Indonesia
// Contoh output: "Jumat, 7 Agustus 2026"
// =====================================================================
function formatTanggalIndonesia(dateString) {
  if (!dateString) return '';
  const hariList = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const bulanList = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

  const parts = String(dateString).split('-');
  let dateObj;
  if (parts.length === 3) {
    dateObj = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  } else {
    dateObj = new Date(dateString);
  }

  if (isNaN(dateObj.getTime())) return dateString;

  const hari = hariList[dateObj.getDay()];
  const tanggal = dateObj.getDate();
  const bulan = bulanList[dateObj.getMonth()];
  const tahun = dateObj.getFullYear();

  return `${hari}, ${tanggal} ${bulan} ${tahun}`;
}

// =====================================================================
// FUNGSI: Update preview format tanggal saat user memilih waktu khutbah

function updateTanggalPreview() {

  const previewEl = document.getElementById('tanggalPreview');
  previewEl.textContent = inputWaktu ? formatTanggalIndonesia(inputWaktu) : '';

// =====================================================================
// FUNGSI: Membuat instance autocomplete kustom (pengganti Choices.js).
// Kolom input yang tampil LANGSUNG berfungsi sebagai kotak pencarian,
// jadi hanya ada satu kolom yang terlihat oleh pengguna.
// =====================================================================
function createAutocomplete({ inputEl, hiddenEl, listEl, placeholderReady }) {
  let items = [];
  let filtered = [];
  let activeIndex = -1;

  function render() {
    if (filtered.length === 0) {
      listEl.innerHTML = '<li class="no-match">Tidak ditemukan</li>';
      return;
    }
    listEl.innerHTML = filtered.map((name, idx) => `
      <li data-idx="${idx}" class="${idx === activeIndex ? 'active' : ''}">${escapeHtml(name)}</li>
    `).join('');
  }

  function openList() { listEl.classList.add('show'); }
  function closeList() { listEl.classList.remove('show'); activeIndex = -1; }

  function filterItems(keyword) {
    const kw = keyword.trim().toLowerCase();
    filtered = kw === '' ? items.slice() : items.filter(n => n.toLowerCase().includes(kw));
    activeIndex = -1;
    render();
  }

  function scrollActiveIntoView() {
    const activeLi = listEl.querySelector('li.active');
    if (activeLi) activeLi.scrollIntoView({ block: 'nearest' });
  }

  function selectItem(name) {
    inputEl.value = name;
    hiddenEl.value = name;
    closeList();
  }

  inputEl.addEventListener('focus', () => {
    if (items.length === 0) return;
    filterItems(inputEl.value);
    openList();
  });

  inputEl.addEventListener('input', () => {
    hiddenEl.value = ''; // batalkan pilihan lama saat pengguna mengetik ulang
    filterItems(inputEl.value);
    openList();
  });

  inputEl.addEventListener('keydown', (e) => {
    if (!listEl.classList.contains('show')) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, filtered.length - 1);
      render();
      scrollActiveIntoView();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      render();
      scrollActiveIntoView();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && filtered[activeIndex]) selectItem(filtered[activeIndex]);
    } else if (e.key === 'Escape') {
      closeList();
    }
  });

  // Gunakan mousedown (bukan click) agar terjadi SEBELUM event blur menutup daftar
  listEl.addEventListener('mousedown', (e) => {
    const li = e.target.closest('li[data-idx]');
    if (!li) return;
    e.preventDefault();
    const idx = parseInt(li.dataset.idx, 10);
    if (filtered[idx]) selectItem(filtered[idx]);
  });

  inputEl.addEventListener('blur', () => {
    setTimeout(() => {
      if (hiddenEl.value === '') {
        const match = items.find(n => n.toLowerCase() === inputEl.value.trim().toLowerCase());
        if (match) {
          selectItem(match);
        } else {
          inputEl.value = '';
          hiddenEl.value = '';
        }
      }
      closeList();
    }, 150);
  });

  return {
    setItems(newItems) {
      items = newItems || [];
      inputEl.value = '';
      hiddenEl.value = '';
      filtered = [];
      closeList();
      if (items.length === 0) {
        inputEl.disabled = true;
        inputEl.placeholder = 'Tidak ada data tersedia';
      } else {
        inputEl.disabled = false;
        inputEl.placeholder = placeholderReady;
      }
    },
    reset() {
      inputEl.value = '';
      hiddenEl.value = '';
      closeList();
    }
  };
}

// =====================================================================
// FUNGSI: Skeleton loader untuk tabel
// =====================================================================
function renderTableSkeleton() {
  const tbody = document.getElementById('tableBody');
  let rows = '';
  for (let i = 0; i < 5; i++) {
    rows += `
      <tr class="skeleton-row">
        <td><div class="skeleton-line" style="width:90px;"></div></td>
        <td><div class="skeleton-line" style="width:110px;"></div></td>
        <td><div class="skeleton-line" style="width:100px;"></div></td>
        <td><div class="skeleton-line" style="width:160px;"></div></td>
        <td><div class="skeleton-line" style="width:40px;"></div></td>
      </tr>`;
  }
  tbody.innerHTML = rows;
  document.getElementById('counterText').textContent = 'Memuat data...';
  document.getElementById('paginationWi').innerHTML = '';
}

// =====================================================================
// FUNGSI: Mengambil data awal (dropdown khatib, masjid, histori) dari backend
// =====================================================================
async function loadInitialData() {
  khatibAutocomplete.setItems([]);
  masjidAutocomplete.setItems([]);
  document.getElementById('inputKhatibSearch').placeholder = 'Memuat data khatib...';
  document.getElementById('inputMasjidSearch').placeholder = 'Memuat data masjid...';
  renderTableSkeleton();

  try {
    const response = await fetch(WEB_APP_URL + '?action=init');
    const result = await response.json();

    if (result.status !== 'success') {
      throw new Error(result.message || 'Gagal memuat data awal.');
    }

    khatibAutocomplete.setItems(result.listKhatib);
    masjidAutocomplete.setItems(result.listMasjid);

    // Backend (getKhutbahHistory_ di Code.gs) sudah mengembalikan data
    // dengan urutan mengikuti POSISI BARIS spreadsheet yang dibalik:
    // baris TERAKHIR di spreadsheet (data terbaru) ada di INDEKS PERTAMA
    // array ini, dan baris PERTAMA di spreadsheet (data terlama) ada di
    // INDEKS TERAKHIR. Frontend tidak perlu mengurutkan ulang di sini.
    khutbahDataFull = result.historiKhutbah || [];
    khutbahDataFiltered = khutbahDataFull.slice();
    currentPage = 1;
    renderTable();

  } catch (err) {
    showToast('Gagal terhubung ke server: ' + err.message, 'error');
    khatibAutocomplete.setItems([]);
    masjidAutocomplete.setItems([]);
    document.getElementById('inputKhatibSearch').placeholder = 'Gagal memuat data';
    document.getElementById('inputMasjidSearch').placeholder = 'Gagal memuat data';
    document.getElementById('tableBody').innerHTML = `
      <tr><td colspan="5">
        <div class="empty-state">
          <i class="bi bi-wifi-off"></i>
          Gagal memuat data. Periksa koneksi atau URL Web App.
        </div>
      </td></tr>`;
    document.getElementById('counterText').textContent = '0 data ditemukan';
    document.getElementById('paginationWi').innerHTML = '';
  }
}

// =====================================================================
// FUNGSI: Render tabel data histori khutbah (dengan pagination, 100 baris/halaman)
// Urutan data mengikuti khutbahDataFiltered apa adanya (baris spreadsheet
// paling bawah/terbaru muncul di atas, sesuai urutan dari backend).
// =====================================================================
function renderTable() {
  const tbody = document.getElementById('tableBody');
  const counterText = document.getElementById('counterText');

  counterText.textContent = `${khutbahDataFiltered.length} data ditemukan`;

  if (khutbahDataFiltered.length === 0) {
    tbody.innerHTML = `
      <tr><td colspan="5">
        <div class="empty-state">
          <i class="bi bi-inbox"></i>
          Tidak ada data yang cocok dengan pencarian.
        </div>
      </td></tr>`;
    document.getElementById('paginationWi').innerHTML = '';
    return;
  }

  // Hitung total halaman & pastikan currentPage berada dalam rentang yang valid
  const totalPages = Math.max(1, Math.ceil(khutbahDataFiltered.length / ROWS_PER_PAGE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  const startIdx = (currentPage - 1) * ROWS_PER_PAGE;
  const pageItems = khutbahDataFiltered.slice(startIdx, startIdx + ROWS_PER_PAGE);

  tbody.innerHTML = pageItems.map((item) => {
    const rowText = `${formatTanggalIndonesia(item.waktuKhutbah)} | ${item.namaKhatib} | ${item.namaMasjid} | ${item.judulKhutbah}`;
    return `
      <tr>
        <td>${formatTanggalIndonesia(item.waktuKhutbah)}</td>
        <td>${escapeHtml(item.namaKhatib)}</td>
        <td>${escapeHtml(item.namaMasjid)}</td>
        <td class="judul-cell">${escapeHtml(item.judulKhutbah)}</td>
        <td>
          <button class="btn-copy-row" onclick="copyRowText(this, \`${rowText.replace(/`/g, "'")}\`)">
            <i class="bi bi-clipboard"></i>
          </button>
        </td>
      </tr>`;
  }).join('');

  renderPagination(totalPages);
}

// =====================================================================
// FUNGSI: Render kontrol pagination (Previous, nomor halaman, Next)
// =====================================================================
function renderPagination(totalPages) {
  const container = document.getElementById('paginationWi');

  if (totalPages <= 1) {
    container.innerHTML = '';
    return;
  }

  let html = '';

  // Tombol Previous
  html += `<button type="button" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})" aria-label="Halaman sebelumnya">
    <i class="bi bi-chevron-left"></i>
  </button>`;

  // Jendela nomor halaman yang ditampilkan (maksimal 5 nomor terlihat)
  const maxButtons = 5;
  let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
  let endPage = Math.min(totalPages, startPage + maxButtons - 1);
  if (endPage - startPage + 1 < maxButtons) {
    startPage = Math.max(1, endPage - maxButtons + 1);
  }

  if (startPage > 1) {
    html += `<button type="button" onclick="goToPage(1)">1</button>`;
    if (startPage > 2) html += `<span class="page-ellipsis">...</span>`;
  }

  for (let p = startPage; p <= endPage; p++) {
    html += `<button type="button" class="${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
  }

  if (endPage < totalPages) {
    if (endPage < totalPages - 1) html += `<span class="page-ellipsis">...</span>`;
    html += `<button type="button" onclick="goToPage(${totalPages})">${totalPages}</button>`;
  }

  // Tombol Next
  html += `<button type="button" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})" aria-label="Halaman berikutnya">
    <i class="bi bi-chevron-right"></i>
  </button>`;

  container.innerHTML = html;
}

// =====================================================================
// FUNGSI: Pindah ke halaman tertentu pada tabel histori
// =====================================================================
function goToPage(page) {
  currentPage = page;
  renderTable();
}

// =====================================================================
// FUNGSI: Salin (copy) teks baris data ke clipboard
// =====================================================================
function copyRowText(btnEl, text) {
  navigator.clipboard.writeText(text).then(() => {
    const originalIcon = btnEl.innerHTML;
    btnEl.classList.add('copied');
    btnEl.innerHTML = '<i class="bi bi-check2"></i>';
    setTimeout(() => {
      btnEl.classList.remove('copied');
      btnEl.innerHTML = originalIcon;
    }, 1500);
  }).catch(() => {
    showToast('Gagal menyalin teks.', 'error');
  });
}

// =====================================================================
// FUNGSI: Pencarian real-time (client-side filtering)
// Mencari pada: nama khatib, nama masjid, judul khutbah, dan tanggal
// (baik format tampilan Indonesia maupun format mentah yyyy-MM-dd).
// =====================================================================
function handleSearch() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

  if (keyword === '') {
    khutbahDataFiltered = khutbahDataFull.slice();
  } else {
    khutbahDataFiltered = khutbahDataFull.filter(item => {
      const khatib = (item.namaKhatib || '').toLowerCase();
      const masjid = (item.namaMasjid || '').toLowerCase();
      const judul = (item.judulKhutbah || '').toLowerCase();
      const waktuFormatted = formatTanggalIndonesia(item.waktuKhutbah).toLowerCase();
      const waktuRaw = (item.waktuKhutbah || '').toLowerCase();

      return khatib.includes(keyword) ||
             masjid.includes(keyword) ||
             judul.includes(keyword) ||
             waktuFormatted.includes(keyword) ||
             waktuRaw.includes(keyword);
    });
  }

  // Setiap kali pencarian berubah, kembali ke halaman pertama
  currentPage = 1;
  renderTable();
}

// =====================================================================
// FUNGSI: Utilitas escape HTML untuk mencegah XSS pada render tabel
// =====================================================================
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// =====================================================================
// FUNGSI: Validasi form sebelum submit
// =====================================================================
function validateForm() {
  const khatib = document.getElementById('inputKhatib').value;
  const masjid = document.getElementById('inputMasjid').value;
  const waktu = document.getElementById('inputWaktu').value;
  const judul = document.getElementById('inputJudul').value.trim();

  if (!khatib || !masjid || !waktu || !judul) {
    showToast('Mohon lengkapi semua kolom wajib diisi.', 'error');
    return false;
  }

  // Validasi tanggal masuk akal: tidak boleh lebih dari 1 tahun ke belakang
  // atau lebih dari 2 tahun ke depan dari hari ini.
  const tanggalDipilih = new Date(waktu);
  const today = new Date();
  const batasBawah = new Date(today);
  batasBawah.setFullYear(today.getFullYear() - 1);
  const batasAtas = new Date(today);
  batasAtas.setFullYear(today.getFullYear() + 2);

  if (isNaN(tanggalDipilih.getTime())) {
    showToast('Format waktu khutbah tidak valid.', 'error');
    return false;
  }

  if (tanggalDipilih < batasBawah || tanggalDipilih > batasAtas) {
    showToast('Waktu khutbah di luar rentang yang wajar. Mohon periksa kembali.', 'error');
    return false;
  }

  return true;
}

// =====================================================================
// FUNGSI: Submit data form ke backend (POST)
// =====================================================================
async function submitKhutbahForm(event) {
  event.preventDefault();

  if (!validateForm()) return;

  const btnSubmit = document.getElementById('btnSubmit');
  const originalContent = btnSubmit.innerHTML;

  // Cegah klik ganda
  btnSubmit.disabled = true;
  btnSubmit.innerHTML = '<span class="spinner-wi"></span> Menyimpan...';

  const payload = {
    namaKhatib: document.getElementById('inputKhatib').value,
    namaMasjid: document.getElementById('inputMasjid').value,
    waktuKhutbah: document.getElementById('inputWaktu').value,
    judulKhutbah: document.getElementById('inputJudul').value.trim(),
    catatan: document.getElementById('inputCatatan').value.trim()
  };

  try {
    const response = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari preflight CORS pada GAS
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (result.status !== 'success') {
      throw new Error(result.message || 'Gagal menyimpan data.');
    }

    showToast('Judul khutbah berhasil disimpan!', 'success');
    document.getElementById('formKhutbah').reset();
    khatibAutocomplete.reset();
    masjidAutocomplete.reset();
    document.getElementById('tanggalPreview').textContent = '';

    // Refresh data tabel agar data baru langsung terlihat di Tab 2.
    // Karena data baru selalu ditambahkan di baris PALING BAWAH
    // spreadsheet, dan backend membalik urutan baris menjadi urutan
    // tampilan webapp, data baru ini otomatis muncul di halaman
    // pertama (paling atas) tabel.
    await loadInitialData();

  } catch (err) {
    showToast('Gagal menyimpan data: ' + err.message, 'error');
  } finally {
    btnSubmit.disabled = false;
    btnSubmit.innerHTML = originalContent;
  }
}

// =====================================================================
// INISIALISASI APLIKASI
// =====================================================================
document.addEventListener('DOMContentLoaded', () => {
  // Set batas tanggal maksimal input agar tidak terlalu jauh ke depan (opsional, 2 tahun)
  const inputWaktu = document.getElementById('inputWaktu');
  const today = new Date();
  const maxDate = new Date(today);
  maxDate.setFullYear(today.getFullYear() + 2);
  const minDate = new Date(today);
  minDate.setFullYear(today.getFullYear() - 1);
  inputWaktu.max = maxDate.toISOString().split('T')[0];
  inputWaktu.min = minDate.toISOString().split('T')[0];

  inputWaktu.addEventListener('change', updateTanggalPreview);
  document.getElementById('formKhutbah').addEventListener('submit', submitKhutbahForm);
  document.getElementById('searchInput').addEventListener('input', handleSearch);

  // Inisialisasi autocomplete kustom (kolom search tunggal) untuk Khatib & Masjid
  khatibAutocomplete = createAutocomplete({
    inputEl: document.getElementById('inputKhatibSearch'),
    hiddenEl: document.getElementById('inputKhatib'),
    listEl: document.getElementById('khatibSuggestions'),
    placeholderReady: 'Ketik untuk mencari nama khatib...'
  });
  masjidAutocomplete = createAutocomplete({
    inputEl: document.getElementById('inputMasjidSearch'),
    hiddenEl: document.getElementById('inputMasjid'),
    listEl: document.getElementById('masjidSuggestions'),
    placeholderReady: 'Ketik untuk mencari nama masjid...'
  });

  loadInitialData();
});
</script>
</body>
